apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dualtrack-app.fullname" . }}
  labels:
    {{- include "dualtrack-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "dualtrack-app.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dualtrack-app.labels" . | nindent 8 }}
    spec:
      containers:
      - name: {{ include "dualtrack-app.name" . }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        ports:
        - containerPort: 3000
